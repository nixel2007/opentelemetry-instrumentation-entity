name: Тестирование

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        oscript_version: ['default', 'stable']
    uses: autumn-library/workflows/.github/workflows/test.yml@main
    with:
      oscript_version: ${{ matrix.oscript_version }}
      test_engine: oneunit
      test_dir_paths: tests
      # macos-latest - это Apple Silicon, а пакет sql везет нативную SQLite только под
      # osx-x64: коннектор SQLite там не грузится. Тесты на маке гоняются на x64-раннере,
      # как в entity.
      os_versions: '["ubuntu-latest", "windows-latest", "macos-15-intel"]'
